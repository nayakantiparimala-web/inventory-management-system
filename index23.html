<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            width: 22%;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .delete {
            background: red;
        }

        .increase {
            background: green;
        }

        .decrease {
            background: orange;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        #total {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            input,
            button {
                width: 100%;
                margin: 5px 0;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Inventory Management System</h1>
    <p>Full Stack Development Project</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add Product</h2>

        <input
            type="text"
            id="product"
            placeholder="Product Name"
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
        >

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
        >

        <button onclick="addProduct()">Add Product</button>
    </div>

    <div class="card">
        <h2>Search Product</h2>

        <input
            type="text"
            id="search"
            placeholder="Search product..."
            onkeyup="searchProduct()"
        >

        <p>
            Total Products:
            <span id="total">0</span>
        </p>
    </div>

    <div class="card">
        <h2>Inventory Details</h2>

        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Stock Value</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productTable"></tbody>
        </table>
    </div>

</div>

<script>

    let products =
        JSON.parse(localStorage.getItem("products")) || [];

    displayProducts(products);

    function addProduct() {

        let product =
            document.getElementById("product").value.trim();

        let category =
            document.getElementById("category").value.trim();

        let price =
            Number(document.getElementById("price").value);

        let quantity =
            Number(document.getElementById("quantity").value);

        if (
            product === "" ||
            category === "" ||
            price <= 0 ||
            quantity <= 0
        ) {
            alert("Please enter valid product details");
            return;
        }

        let item = {
            product: product,
            category: category,
            price: price,
            quantity: quantity
        };

        products.push(item);

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        document.getElementById("product").value = "";
        document.getElementById("category").value = "";
        document.getElementById("price").value = "";
        document.getElementById("quantity").value = "";

        displayProducts(products);
    }

    function displayProducts(list) {

        let table =
            document.getElementById("productTable");

        table.innerHTML = "";

        list.forEach(function(item, index) {

            let stockValue =
                item.price * item.quantity;

            let row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.product}</td>
                <td>${item.category}</td>
                <td>₹${item.price}</td>
                <td>${item.quantity}</td>
                <td>₹${stockValue}</td>

                <td>
                    <button
                        class="increase"
                        onclick="increaseStock(${index})">
                        +
                    </button>

                    <button
                        class="decrease"
                        onclick="decreaseStock(${index})">
                        -
                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

        document.getElementById("total").innerText =
            list.length;
    }

    function increaseStock(index) {

        products[index].quantity++;

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        displayProducts(products);
    }

    function decreaseStock(index) {

        if (products[index].quantity > 0) {
            products[index].quantity--;
        }

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        displayProducts(products);
    }

    function deleteProduct(index) {

        products.splice(index, 1);

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        displayProducts(products);
    }

    function searchProduct() {

        let text =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filtered =
            products.filter(function(item) {

                return (
                    item.product
                        .toLowerCase()
                        .includes(text) ||

                    item.category
                        .toLowerCase()
                        .includes(text)
                );
            });

        displayProducts(filtered);
    }

</script>

</body>
</html>
